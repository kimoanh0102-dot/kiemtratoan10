                </div>
                Trung vị của mẫu số liệu trên bằng:`, 
                options: {A: "15,5", B: "15", C: "16", D: "14"}, answer: "A"
            }
        ];

        // --- COMPONENTS ---

        // Custom Modal Confirm
        const ConfirmModal = ({ isOpen, onClose, onConfirm, title, message }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[110] modal-overlay">
                    <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 transform transition-all scale-100">
                        <h3 className="text-xl font-bold mb-2 text-gray-800">{title}</h3>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <div className="flex space-x-3">
                            <button 
                                onClick={onClose}
                                className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition"
                            >
                                Hủy
                            </button>
                            <button 
                                onClick={onConfirm}
                                className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition"
                            >
                                Đồng ý
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const WarningModal = ({ message, onClose }) => {
            if (!message) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] modal-overlay">
                    <div className="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 border-l-8 border-red-500 transform transition-all scale-100">
                        <div className="flex items-center mb-4 text-red-600">
                            <svg className="w-8 h-8 mr-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                            </svg>
                            <h3 className="text-xl font-bold">Cảnh Báo</h3>
                        </div>
                        <p className="text-gray-700 mb-6 font-medium">{message}</p>
                        <button 
                            onClick={onClose}
                            className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg transition"
                        >
                            Đã Hiểu
                        </button>
                    </div>
                </div>
            );
        };

        const QuizScreen = ({ questions, studentInfo, onFinish }) => {
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(20 * 60);
            const [warnings, setWarnings] = useState(0);
            const [showConfirm, setShowConfirm] = useState(false);
            const [modalMessage, setModalMessage] = useState(null);
            
            const submittedRef = useRef(false);

            // Timer
            useEffect(() => {
                const timer = setInterval(() => {
                    setTimeLeft((prev) => {
                        if (prev <= 0) {
                            clearInterval(timer);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, []);

            // Auto submit when time over
            useEffect(() => {
                if (timeLeft === 0 && !submittedRef.current) {
                    handleSubmit(true);
                }
            }, [timeLeft]);

            // MathJax
            useEffect(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise().catch(e => console.log(e));
                }
            }, [questions]);

            // Anti-Cheat
            useEffect(() => {
                const handleVisibilityChange = () => {
                    if (document.hidden && !submittedRef.current) {
                        const newWarnings = warnings + 1;
                        setWarnings(newWarnings);
                        if (newWarnings >= 2) {
                            setModalMessage("HỆ THỐNG PHÁT HIỆN GIAN LẬN: Bạn đã rời khỏi màn hình quá 2 lần. Bài thi sẽ tự động nộp.");
                            setTimeout(() => handleSubmit(true), 3000);
                        } else {
                            setModalMessage(`CẢNH BÁO VI PHẠM (${newWarnings}/2): Vui lòng không rời khỏi màn hình làm bài.`);
                        }
                    }
                };
                
                const preventCopy = (e) => { e.preventDefault(); setModalMessage("Không được sao chép nội dung!"); };
                
                document.addEventListener("visibilitychange", handleVisibilityChange);
                document.addEventListener("copy", preventCopy);
                document.addEventListener("contextmenu", e => e.preventDefault());

                return () => {
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                    document.removeEventListener("copy", preventCopy);
                    document.removeEventListener("contextmenu", e => e.preventDefault());
                };
            }, [warnings]);

            const handleSelect = (qId, option) => {
                if (!submittedRef.current) {
                    setAnswers(prev => ({...prev, [qId]: option}));
                }
            };

            const handleSubmit = (force = false) => {
                if (submittedRef.current) return;
                submittedRef.current = true;
                setShowConfirm(false);
                
                let score = 0;
                questions.forEach(q => {
                    if (answers[q.id] === q.answer) score += 1;
                });
                
                onFinish(score, warnings);
            };

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            };

            const answeredCount = Object.keys(answers).length;
            const progress = (answeredCount / questions.length) * 100;

            return (
                <div className="max-w-4xl mx-auto p-4 pb-20 relative">
                    <WarningModal message={modalMessage} onClose={() => setModalMessage(null)} />
                    <ConfirmModal 
                        isOpen={showConfirm} 
                        onClose={() => setShowConfirm(false)}
                        onConfirm={() => handleSubmit(false)}
                        title="Nộp bài thi?"
                        message="Bạn có chắc chắn muốn nộp bài? Hành động này không thể hoàn tác."
                    />

                    <div className="bg-white rounded-xl shadow-md p-4 mb-6 sticky top-4 z-50 flex justify-between items-center border-l-4 border-indigo-500">
                        <div>
                            <h2 className="font-bold text-gray-800">{studentInfo.name} - {studentInfo.className}</h2>
                            <div className="text-xs text-gray-500 mt-1">
                                Đã làm: <span className="font-bold text-indigo-600">{answeredCount}/{questions.length}</span> câu
                            </div>
                        </div>
                        <div className={`text-xl font-mono font-bold px-4 py-2 rounded-lg ${timeLeft < 60 ? 'bg-red-100 text-red-600 animate-pulse' : 'bg-gray-100 text-gray-700'}`}>
                            {formatTime(timeLeft)}
                        </div>
                    </div>

                    <div className="w-full bg-gray-200 rounded-full h-2.5 mb-6">
                        <div className="bg-indigo-600 h-2.5 rounded-full transition-all duration-500" style={{width: `${progress}%`}}></div>
                    </div>

                    <div className="space-y-6">
                        {questions.map((q, index) => (
                            <div key={q.id} className="bg-white rounded-xl shadow-sm p-6 hover:shadow-md transition">
                                <div className="flex items-start mb-4">
                                    <span className="bg-indigo-100 text-indigo-800 text-sm font-bold px-2.5 py-0.5 rounded mr-2 mt-0.5">Câu {index + 1}</span>
                                    <div className="math-content text-gray-800 font-medium w-full" dangerouslySetInnerHTML={{__html: q.question}}></div>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-3 pl-2">
                                    {Object.entries(q.options).map(([key, value]) => (
                                        <label 
                                            key={key} 
                                            className={`relative flex items-center p-3 rounded-lg border-2 cursor-pointer transition-all duration-200 
                                                ${answers[q.id] === key 
                                                    ? 'border-indigo-500 bg-indigo-50 shadow-inner' 
                                                    : 'border-gray-200 hover:border-indigo-200 hover:bg-gray-50'}`}
                                        >
                                            <input 
                                                type="radio" 
                                                name={`q-${q.id}`} 
                                                value={key}
                                                checked={answers[q.id] === key}
                                                onChange={() => handleSelect(q.id, key)}
                                                className="hidden"
                                            />
                                            <div className={`w-6 h-6 rounded-full border-2 mr-3 flex items-center justify-center flex-shrink-0
                                                ${answers[q.id] === key ? 'border-indigo-500 bg-indigo-500 text-white' : 'border-gray-300'}`}>
                                                {answers[q.id] === key ? key : <span className="text-xs text-gray-400 font-bold">{key}</span>}
                                            </div>
                                            <span className="math-content" dangerouslySetInnerHTML={{__html: value}}></span>
                                        </label>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-8 text-center">
                        <button 
                            onClick={() => setShowConfirm(true)}
                            className="bg-gradient-to-r from-pink-500 to-rose-500 hover:shadow-xl hover:-translate-y-1 text-white text-lg font-bold py-3 px-12 rounded-full shadow-lg transform transition"
                        >
                            NỘP BÀI THI
                        </button>
                    </div>
                </div>
            );
        };

        const ResultScreen = ({ score, studentInfo }) => {
            return (
                <div className="flex flex-col items-center justify-center min-h-[90vh] px-4 animate-fade-in">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-lg text-center relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 to-blue-500"></div>
                        <div className="mb-6">
                            <div className="inline-block p-4 rounded-full bg-green-100 mb-4">
                                <svg className="w-12 h-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"/></svg>
                            </div>
                            <h2 className="text-2xl font-bold text-gray-800">Hoàn Thành Bài Thi!</h2>
                            <p className="text-gray-500 mt-2">Chúc mừng <b>{studentInfo.name}</b> (Lớp {studentInfo.className})</p>
                        </div>
                        <div className="bg-gray-50 rounded-xl p-8 mb-8 border border-gray-100">
                            <p className="text-gray-500 text-sm uppercase tracking-wider mb-2">Tổng điểm</p>
                            <div className="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-br from-indigo-600 to-purple-600">{score}/10</div>
                        </div>
                        <button onClick={() => window.location.reload()} className="text-indigo-600 font-semibold hover:underline">Quay về trang chủ</button>
                    </div>
                </div>
            );
        };

        const IntroScreen = ({ onStart, maxAttempts }) => {
            const [name, setName] = useState("");
            const [className, setClassName] = useState("");
            const [error, setError] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!name.trim() || !className.trim()) {
                    setError("Vui lòng điền đầy đủ thông tin!");
                    return;
                }
                
                try {
                    // Logic kiểm tra số lần làm bài căn cứ theo họ tên (bỏ khoảng trắng và chữ hoa thường)
                    const storageKey = `math10_attempts_${name.trim().toLowerCase().replace(/\s/g, '')}`;
                    const attempts = parseInt(localStorage.getItem(storageKey) || "0");
                    if (attempts >= maxAttempts) {
                        setError(`Bạn tên là "${name}" đã làm bài ${attempts} lần. Quá số lần quy định (${maxAttempts} lần).`);
                        return;
                    }
                    localStorage.setItem(storageKey, attempts + 1);
                } catch(e) { console.log("Storage warning", e); }
                
                onStart(name, className);
            };

            return (
                <div className="flex flex-col items-center justify-center min-h-[80vh] px-4 animate-fade-in-up">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md border-t-8 border-indigo-600">
                        <div className="text-center mb-6">
                            <h1 className="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-2">KIỂM TRA TOÁN 10</h1>
                            <p className="text-gray-500 text-sm">Thời gian: 20 phút • 10 Câu hỏi</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Họ và Tên</label>
                                <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-300 focus:border-indigo-500 outline-none" placeholder="Nhập họ tên..." />
                            </div>
                            <div>
                                <label className="block text-gray-700 text-sm font-bold mb-2">Lớp</label>
                                <input type="text" value={className} onChange={(e) => setClassName(e.target.value)} className="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-300 focus:border-indigo-500 outline-none" placeholder="Ví dụ: 10A1" />
                            </div>
                            {error && <div className="bg-red-100 border-l-4 border-red-500 text-red-700 p-3 text-sm rounded">{error}</div>}
                            <button type="submit" className="w-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transform hover:scale-105 transition">BẮT ĐẦU LÀM BÀI</button>
                        </form>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('intro');
            const [studentInfo, setStudentInfo] = useState({name: '', className: ''});
            const [quizQuestions, setQuizQuestions] = useState([]);
            const [score, setScore] = useState(0);
            const [startTime, setStartTime] = useState(null);

            const shuffleArray = (array) => {
                const newArr = [...array];
                for (let i = newArr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
                }
                return newArr;
            };

            const generateTest = () => {
                try {
                    const pools = {
                        TK: rawQuestions.filter(q => q.category === 'TK'),
                        BPT: rawQuestions.filter(q => q.category === 'BPT'),
                        SS: rawQuestions.filter(q => q.category === 'SS'),
                        MD: rawQuestions.filter(q => q.category === 'MD'),
                        VT: rawQuestions.filter(q => q.category === 'VT'),
                        HTL: rawQuestions.filter(q => q.category === 'HTL'),
                    };
                    return shuffleArray([
                        ...shuffleArray(pools.TK).slice(0, 2),
                        ...shuffleArray(pools.BPT).slice(0, 2),
                        ...shuffleArray(pools.SS).slice(0, 1),
                        ...shuffleArray(pools.MD).slice(0, 2),
                        ...shuffleArray(pools.VT).slice(0, 2),
                        ...shuffleArray(pools.HTL).slice(0, 1),
                    ]);
                } catch(e) {
                    return rawQuestions.slice(0, 10);
                }
            };

            const handleStart = (name, className) => {
                setStudentInfo({name, className});
                setStartTime(new Date());
                setQuizQuestions(generateTest());
                setView('quiz');
            };

            const handleFinish = (finalScore, violations) => {
                setScore(finalScore);
                
                try {
                    const endTime = new Date();
                    const safeStart = startTime || new Date();
                    const duration = ((endTime - safeStart) / 1000 / 60).toFixed(2);
                    
                    const data = {
                        name: studentInfo.name,
                        className: studentInfo.className,
                        score: finalScore,
                        duration: duration,
                        startTime: safeStart.toLocaleString('vi-VN'),
                        violations: violations
                    };

                    if (!GOOGLE_SCRIPT_URL.includes("REPLACE")) {
                        const formData = new FormData();
                        for (const key in data) formData.append(key, data[key]);
                        fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: formData, mode: 'no-cors' }).catch(e=>console.log(e));
                    }
                } catch(e) { console.log("Submit error", e); }

                setView('result');
            };

            return (
                <div className="min-h-screen">
                    {view === 'intro' && <IntroScreen onStart={handleStart} maxAttempts={3} />}
                    {view === 'quiz' && <QuizScreen questions={quizQuestions} studentInfo={studentInfo} onFinish={handleFinish} />}
                    {view === 'result' && <ResultScreen score={score} studentInfo={studentInfo} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
